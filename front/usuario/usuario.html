<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bike Pro | Gestão de Usuários</title>
    <link rel="stylesheet" href="../index/index.css"> <!-- Reutiliza seu CSS global -->
    <link rel="stylesheet" href="clientes.css">
</head>
<body>
    <header>
        <nav class="container nav-principal">
            <div class="logo">
                <a href="../index/index.html" style="text-decoration: none; color: inherit;">Bike<span>Pro</span></a>
            </div>
            <ul id="menu-navegacao" class="menu-direita">
                <!-- Preenchido pelo index.js -->
            </ul>
        </nav>
    </header>

    <main class="container">
        <div class="header-tabela">
            <h2 class="destaque-sm" style="margin-bottom: 0; text-align: left;">Gestão de <span>Usuários</span></h2>
            <button class="cta-comprar" onclick="abrirModalCadastro()">+ Novo Usuário</button>
        </div>

        <div class="tabela-container">
            <table>
                <thead>
                    <tr>
                        <th>ID</th>
                        <th>Nome</th>
                        <th>E-mail</th>
                        <th>Perfil</th>
                        <th>Ações</th>
                    </tr>
                </thead>
                <tbody id="tabela-usuarios-corpo">
                    <!-- O JS vai carregar os dados da API_LOGIN aqui -->
                    <tr>
                        <td colspan="5">Carregando usuários...</td>
                    </tr>
                </tbody>
            </table>
        </div>
    </main>

    <script src="../index/index.js"></script>
    <script>
        // Lógica simples para carregar a tabela baseada no seu index.js
        async function carregarUsuarios() {
            const corpoTabela = document.getElementById('tabela-usuarios-corpo');
            try {
                const resposta = await fetch("http://127.0.0.1", {
                    headers: { 'minha-chave': "SUA_CHAVE_SECRETA_MUITO_FORTE_123456" }
                });
                const usuarios = await resposta.json();
                
                corpoTabela.innerHTML = "";
                usuarios.forEach(u => {
                    corpoTabela.innerHTML += `
                        <tr>
                            <td>#${u.id}</td>
                            <td>${u.nome}</td>
                            <td>${u.email}</td>
                            <td><span class="badge ${u.perfil}">${u.perfil}</span></td>
                            <td>
                                <button class="btn-remover" onclick="excluirUsuario(${u.id})">Excluir</button>
                            </td>
                        </tr>
                    `;
                });
            } catch (erro) {
                corpoTabela.innerHTML = "<tr><td colspan='5'>Erro ao carregar dados.</td></tr>";
            }
        }
        document.addEventListener('DOMContentLoaded', carregarUsuarios);
    </script>
</body>
</html>
