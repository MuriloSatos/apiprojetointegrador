<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bike Pro | Usuários</title>
    <link rel="stylesheet" href="../index/index.css">
    <link rel="stylesheet" href="usuarios.css">
</head>

<body>
    <header>
        <nav class="container nav-principal">
            <div class="logo">
                <a href="../index/index.html" style="text-decoration: none; color: inherit;">
                    BIKE<span>PROMAX</span>
                </a>
            </div>

            <ul class="menu-central" id="menu-navegacao">
                <li><a href="../index/index.html">Inicio</a></li>
                <li><a href="../produto/produto.html">Catalago</a></li>
                <li><a href="../vendas/vendas.html">Venda</a></li>
                <li><a href="../usuario/usuario.html">Usuarios</a></li>
            </ul>

            <ul class="menu-direita">
                <li>
                    <a href="javascript:void(0)" class="carrinho-link" onclick="abrirModal()">
                        🛒 Carrinho <span id="contagem-carrinho">(0)</span>
                    </a>
                </li>
                <li><a href="javascript:void(0)" class="btn-login" onclick="abrirModalLogin()">Login</a></li>
            </ul>
        </nav>
    </header>

    <main class="container">
        <section id="sessao-login" class="auth-wrapper">
            <div class="card-auth">
                <h2 id="auth-titulo">Fazer <span>Login</span></h2>
                <form id="form-auth">
                    <div id="campo-nome" style="display: none;">
                        <label>Nome Completo</label>
                        <input type="text" id="reg-nome" placeholder="Digite seu nome">
                    </div>

                    <label>E-mail</label>
                    <input type="email" id="auth-email" placeholder="exemplo@email.com" required>

                    <label>Senha</label>
                    <input type="password" id="auth-senha" placeholder="******" required>

                    <button type="submit" id="btn-auth-principal" class="btn-laranja">Entrar</button>
                </form>
                <p id="auth-alternar">Ainda não tem conta? <a href="javascript:void(0)"
                        onclick="alternarModo()">Cadastre-se aqui</a></p>
            </div>
        </section>

        <!-- HTML DA GESTÃO DE USUÁRIOS -->
        <section id="sessao-gestao" style="display: none;" class="container sessao-gestao">
            <div class="dashboard-header">
                <h1><i class="fas fa-users" style="color: var(--primaria);"></i> Gestão de Usuários</h1>
                
                <!-- Nova Barra de Pesquisa -->
                <div class="pesquisa-box">
                    <i class="fas fa-search"></i>
                    <input type="text" id="input-pesquisa-usuario" placeholder="Buscar por nome ou e-mail..." oninput="filtrarUsuarios()">
                </div>
            </div>

            <!-- Tabela em Card Branco -->
            <div class="tabela-container">
                <table>
                    <thead>
                        <tr>
                            <th>ID</th>
                            <th>Usuário</th>
                            <th>E-mail</th>
                            <th>Perfil</th>
                            <th>Ações</th>
                        </tr>
                    </thead>
                    <tbody id="tabela-usuarios-corpo">
                        <!-- Injetado pelo Javascript -->
                    </tbody>
                </table>
            </div>
        </section>

    </main>

    <script src="usuario.js"></script>
    
    <!-- 🔒 SCRIPT DE SEGURANÇA ADICIONADO AQUI -->
    <script src="../assets/seguranca.js"></script>
</body>

</html>
