<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BIKEPROMAX | Meu Carrinho</title>
    <link rel="stylesheet" href="carrinho.css">
    <!-- FontAwesome para os ícones -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="carrinho.js" defer></script>
</head>
<body>
    <header>
        <nav class="container nav-principal">
            <div class="logo">
                <a href="../index/index.html">BIKE<span>PROMAX</span></a>
            </div>
            <ul class="menu-central" id="menu-navegacao">
                <li><a href="../index/index.html">Início</a></li>
                <li><a href="../produto/produto.html">Catálogo</a></li>
                <!-- Link para o Histórico de Vendas do Banco de Dados -->
                <li><a href="../pedidos/meus-pedidos.html">Meus Pedidos</a></li>
            </ul>
            <ul class="menu-direita" id="menu-direita">
                <li><a href="../login/login.html" class="btn-login-top">Login</a></li>
            </ul>
        </nav>
    </header>

    <main class="container-carrinho">
        <div class="cabecalho-carrinho">
            <h2><i class="fas fa-shopping-cart"></i> Meu Carrinho de Compras</h2>
            <a href="../produto/produto.html" class="btn-voltar"><i class="fas fa-arrow-left"></i> Continuar Comprando</a>
        </div>

        <div class="layout-carrinho">
            <!-- ÁREA DA ESQUERDA: LISTA DE PRODUTOS -->
            <div class="itens-carrinho-area">
                <div class="tabela-responsiva">
                    <table>
                        <thead>
                            <tr>
                                <th>Produto</th>
                                <th>Preço Unitário</th>
                                <th>Qtd</th>
                                <th>Subtotal</th>
                                <th>Ação</th>
                            </tr>
                        </thead>
                        <tbody id="tabela-itens-carrinho">
                            <!-- O JavaScript vai injetar os produtos aqui do Supabase -->
                            <tr>
                                <td colspan="5" class="mensagem-vazio">
                                    <i class="fas fa-spinner fa-spin" style="font-size: 24px; margin-bottom: 10px; display: block; color: #ff6600;"></i>
                                    Carregando seu carrinho...
                                </td>
                            </tr>
                        </tbody>
                    </table>
                </div>
            </div>

            <!-- ÁREA DA DIREITA: RESUMO E PAGAMENTO -->
            <div class="resumo-carrinho-area">
                <div class="card-resumo">
                    <h3>Resumo do Pedido</h3>
                    <hr>
                    <div class="linha-resumo">
                        <span>Subtotal:</span>
                        <span id="valor-subtotal">R$ 0,00</span>
                    </div>
                    <div class="linha-resumo destaque">
                        <span>Total:</span>
                        <span id="valor-total-final">R$ 0,00</span>
                    </div>

                    <div class="area-pagamento">
                        <label for="select-pagamento-final"><i class="fas fa-wallet"></i> Forma de Pagamento</label>
                        <div class="select-wrapper">
                            <select id="select-pagamento-final">
                                <option value="Cartão de Crédito">💳 Cartão de Crédito</option>
                                <option value="Pix">💠 Pix (5% de Desconto)</option>
                                <option value="Boleto">📄 Boleto Bancário</option>
                            </select>
                        </div>
                    </div>

                    <button class="btn-finalizar-compra" onclick="finalizarCompraDefinitiva()">
                        <i class="fas fa-check-circle"></i> Confirmar e Pagar
                    </button>

                    <div class="seguranca-badge">
                        <i class="fas fa-lock"></i> Compra 100% Segura
                    </div>
                </div>
            </div>
        </div>
    </main>
</body>
</html>
