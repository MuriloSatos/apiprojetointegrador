<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BIKE PROMAX | Catálogo</title>
    <link rel="stylesheet" href="produto.css">
    <script src="produto.js" defer></script>
</head>

<body>
    <header>
        <nav class="container nav-principal">
            <div class="logo">
                <a href="../index/index.html" style="text-decoration: none; color: inherit;">
                    BIKE<span>PROMAX</span>
                </a>
            </div>

            <ul class="menu-central" id="menu-navegacao">
                <li><a href="../index/index.html">Início</a></li>
                <li><a href="../produto/produto.html">Catálogo</a></li>
            </ul>

            <ul class="menu-direita" id="menu-direita">
                <li><a href="javascript:void(0)" onclick="abrirModalCarrinho()">🛒 Carrinho <span
                            id="contagem-carrinho">(0)</span></a></li>
                <li><button class="btn-login-top" onclick="window.location.href='../login/login.html'">Login</button>
                </li>
            </ul>
        </nav>
    </header>

    <main class="container">
        <section class="barra-acoes">
            <div class="filtros-container">
                <div class="campo-filtro barra-pesquisa">
                    <label>O que você está procurando?</label>
                    <input type="text" id="input-busca" placeholder="Ex: Mountain Bike Aro 29...">
                </div>
                <div class="campo-filtro">
                    <label>Categoria</label>
                    <select id="select-tipo">
                        <option value="">Todas</option>
                    </select>
                </div>
                <div class="campo-filtro">
                    <label>Preço Máximo</label>
                    <input type="number" id="input-preco" placeholder="R$">
                </div>
            </div>

            <button id="btn-abrir-cadastro" class="btn-novo" style="display: none;" onclick="abrirModalCadastro()">
                + Novo Produto
            </button>
        </section>

        <div class="grid" id="catalogo-home"></div>
    </main>

    <div id="modal-novo-produto" class="modal">
        <div class="modal-content">
            <span class="close" onclick="fecharModalCadastro()">&times;</span>
            <h2>📦 Novo Produto</h2>
            <form id="form-cadastro-produto">
                <div class="campo-filtro-modal">
                    <label>Nome do Produto</label>
                    <input type="text" id="cad-nome" name="nomeproduto" placeholder="Ex: Bike Oggi 29" required>
                </div>

                <div class="campo-filtro-modal">
                    <label>Imagem do Produto (Arquivo)</label>
                    <input type="file" id="cad-imagem" name="imagem" accept="image/*" required>
                </div>

                <div style="display: flex; gap: 10px;">
                    <div class="campo-filtro-modal" style="flex: 1;">
                        <label>Categoria</label>
                        <input type="text" id="cad-tipo" name="tipoproduto" required>
                    </div>
                    <div class="campo-filtro-modal" style="flex: 1;">
                        <label>Preço (R$)</label>
                        <input type="number" step="0.01" id="cad-preco" name="preco" placeholder="0.00" required>
                    </div>
                </div>

                <div style="display: flex; gap: 10px;">
                    <div class="campo-filtro-modal" style="flex: 1;">
                        <label>Tamanho</label>
                        <input type="text" id="cad-tamanho" name="tamanhoproduto" required>
                    </div>
                    <div class="campo-filtro-modal" style="flex: 1;">
                        <label>Marca</label>
                        <input type="text" id="cad-marca" name="marcaproduto" required>
                    </div>
                </div>

                <div style="display: flex; gap: 10px;">
                    <div class="campo-filtro-modal" style="flex: 1;">
                        <label>Código</label>
                        <input type="number" id="cad-codigo" name="codigoproduto" required>
                    </div>
                    <div class="campo-filtro-modal" style="flex: 1;">
                        <label>Estoque</label>
                        <input type="number" id="cad-estoque" name="estoque" value="1" required>
                    </div>
                </div>

                <div class="previa-box">
                    <img id="previa-img" src="" alt="Prévia"
                        style="max-width: 100%; max-height: 150px; display: block; margin: 10px auto;">
                </div>

                <button type="submit" class="btn-acao-salvar">Salvar Produto</button>
            </form>
        </div>
    </div>

<div id="modal-carrinho" class="modal" style="display: none;">
    <div class="modal-content">
        <span onclick="fecharModalCarrinho()" style="cursor:pointer; float:right; font-size:24px;">&times;</span>
        <h2 style="text-align:center;">🛒 Seu Carrinho</h2>
        
        <div id="itens-carrinho" style="max-height: 300px; overflow-y: auto;"></div>
        
        <h3 id="total-carrinho" style="text-align:center; margin-top:20px;">Total: R$ 0,00</h3>
        
        <button onclick="finalizarCompra()" style="width:100%; padding:15px; background:#ff6600; color:white; border:none; cursor:pointer;">
            Finalizar Compra
        </button>
    </div>
</div>
</body>

</html>
