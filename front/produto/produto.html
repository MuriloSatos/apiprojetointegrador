<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BIKEPROMAX | Catálogo de Produtos</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="produto.css">
    <script src="produto.js" defer></script>
</head>
<body>
    <header class="header-main">
        <nav class="container nav-principal">
            <div class="logo">
                <a href="../index/index.html">BIKE<span>PROMAX</span></a>
            </div>
            <ul class="menu-central" id="menu-navegacao">
            </ul>
            <ul class="menu-direita" id="menu-direita">
                <!-- Injetado pelo JS -->
            </ul>
        </nav>
    </header>

    <section class="catalogo-header">
        <div class="container">
            <h1>Nosso Catálogo</h1>
            <p>Encontre a máquina perfeita para o seu estilo de pedal.</p>
        </div>
    </section>

    <section class="container">
        <div class="barra-acoes">
            <div class="filtros-container">
                <div class="campo-filtro input-icone">
                    <i class="fas fa-search"></i>
                    <input type="text" id="input-busca" placeholder="Buscar modelo, marca...">
                </div>
                <div class="campo-filtro">
                    <select id="select-tipo">
                        <option value="">Todas as Categorias</option>
                    </select>
                </div>
                <div class="campo-filtro input-icone">
                    <i class="fas fa-tag"></i>
                    <input type="number" id="input-preco" placeholder="Preço Máximo (R$)">
                </div>
            </div>
            <button id="btn-abrir-cadastro" class="btn-primario" onclick="abrirModalCadastro()" style="display: none;">
                <i class="fas fa-plus"></i> Novo Produto
            </button>
        </div>
    </section>

    <main class="container">
        <div class="grid-produtos" id="catalogo-home">
            <div class="carregando"><i class="fas fa-spinner fa-spin"></i> Carregando catálogo...</div>
        </div>
        <div id="paginacao-container" class="paginacao-container"></div>
    </main>

    <div id="overlay-cadastro" class="overlay-escuro" onclick="fecharModalCadastro()"></div>
    <div id="modal-novo-produto" class="modal-centro">
        <button class="btn-fechar-modal" onclick="fecharModalCadastro()">&times;</button>
        <div class="conteudo-modal">
            <h2><i class="fas fa-box-open" style="color: var(--primaria);"></i> Cadastrar Produto</h2>
            <form id="form-cadastro-produto" class="form-moderno">
                <div class="campo-full">
                    <label>Nome do Produto</label>
                    <input type="text" name="nomeproduto" placeholder="Ex: Mountain Bike Oggi 29" required>
                </div>
                <div class="form-grid">
                    <div class="campo">
                        <label>Categoria</label>
                        <input type="text" name="tipoproduto" placeholder="Ex: MTB" required>
                    </div>
                    <div class="campo">
                        <label>Preço (R$)</label>
                        <input type="number" step="0.01" name="preco" placeholder="0.00" required>
                    </div>
                </div>
                <div class="form-grid">
                    <div class="campo">
                        <label>Tamanho</label>
                        <input type="text" name="tamanhoproduto" placeholder="Ex: 19" required>
                    </div>
                    <div class="campo">
                        <label>Marca</label>
                        <input type="text" name="marcaproduto" placeholder="Ex: Oggi" required>
                    </div>
                </div>
                <div class="form-grid">
                    <div class="campo">
                        <label>Código SKU</label>
                        <input type="number" name="codigoproduto" placeholder="Ex: 1001" required>
                    </div>
                    <div class="campo">
                        <label>Estoque Inicial</label>
                        <input type="number" name="estoque" value="1" required>
                    </div>
                </div>
                <div class="campo-full">
                    <label>URL da Imagem</label>
                    <input type="text" id="cad-imagem-url" name="imagem" placeholder="Cole o link da imagem aqui" required>
                    <div class="previa-box">
                        <img id="previa-img" src="../assets/sem-foto.png" alt="Prévia">
                    </div>
                </div>
                <button type="submit" class="btn-sucesso btn-block" style="margin-top: 15px;">Salvar Produto</button>
            </form>
        </div>
    </div>

    <div id="overlay-carrinho" class="overlay-escuro" onclick="fecharModalCarrinho()"></div>
    <div id="modal-carrinho" class="modal-centro">
        <button class="btn-fechar-modal" onclick="fecharModalCarrinho()">&times;</button>
        <div class="conteudo-modal">
            <h2 style="border-bottom: 2px solid var(--fundo); padding-bottom: 15px; margin-bottom: 0;">
                <i class="fas fa-shopping-cart" style="color: var(--primaria);"></i> Seu Carrinho
            </h2>
            
            <div class="carrinho-body-centro" id="itens-carrinho">
            </div>
            
            <div class="carrinho-footer-centro">
                <div class="carrinho-total">
                    <span>Total Estimado:</span>
                    <strong id="total-carrinho">R$ 0,00</strong>
                </div>
                <button class="btn-primario btn-block" onclick="window.location.href='../carrinho/carrinho.html'" style="padding: 15px; font-size: 1.1rem;">
                    Revisar e Pagar <i class="fas fa-arrow-right"></i>
                </button>
                <button class="btn-continuar" onclick="fecharModalCarrinho()">Continuar Comprando</button>
            </div>
        </div>
    </div>

    <div id="toast-container"></div>
</body>
</html>
