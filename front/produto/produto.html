<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BIKE PROMAX | Catálogo</title>
    <link rel="stylesheet" href="produto.css">
    <script src="produto.js" defer></script>
</head>

<body>
    <header>
        <nav class="container nav-principal">
            <div class="logo">
                <a href="../index/index.html">
                    BIKE<span>PROMAX</span>
                </a>
            </div>
            <ul class="menu-central" id="menu-navegacao">
                <li><a href="../index/index.html">Início</a></li>
                <li><a href="../produto/produto.html">Catálogo</a></li>
            </ul>

            <ul class="menu-direita" id="menu-direita">
                <li><a href="javascript:void(0)" onclick="abrirModalCarrinho()">🛒 Carrinho <span
                            id="contagem-carrinho">(0)</span></a></li>
                <li><button class="btn-login-top" onclick="window.location.href='../login/login.html'">Login</button>
                </li>
            </ul>
        </nav>
    </header>

    <section class="barra-acoes">
        <div class="filtros-container">
            <div class="campo-filtro">
                <label>O que você está procurando?</label>
                <input type="text" id="input-busca" placeholder="Ex: Mountain Bike Aro 29...">
            </div>
            <div class="campo-filtro">
                <label>Categoria</label>
                <select id="select-tipo">
                    <option value="">Todas</option>
                </select>
            </div>
            <div class="campo-filtro">
                <label>Preço Máximo</label>
                <input type="number" id="input-preco" placeholder="R$ 0,00">
            </div>
        </div>

        <button id="btn-abrir-cadastro" onclick="abrirModalCadastro()">
            + Novo Produto
        </button>
    </section>

    <div class="grid" id="catalogo-home"></div>
    </main>

    <div id="modal-novo-produto" class="modal">
        <div class="modal-content">
            <div class="modal-header">
                <h2>📦 Novo Produto</h2>
                <span class="close" onclick="fecharModalCadastro()">&times;</span>
            </div>

            <form id="form-cadastro-produto">
                <div class="campo-full">
                    <label>Nome do Produto</label>
                    <input type="text" name="nomeproduto" placeholder="Ex: Bike Oggi 29" required>
                </div>

                <div class="form-grid">
                    <div class="campo">
                        <label>Categoria</label>
                        <input type="text" name="tipoproduto" required>
                    </div>
                    <div class="campo">
                        <label>Preço (R$)</label>
                        <input type="number" step="0.01" name="preco" placeholder="0.00" required>
                    </div>
                </div>

                <div class="form-grid">
                    <div class="campo">
                        <label>Tamanho</label>
                        <input type="text" name="tamanhoproduto" required>
                    </div>
                    <div class="campo">
                        <label>Marca</label>
                        <input type="text" name="marcaproduto" required>
                    </div>
                </div>

                <div class="form-grid">
                    <div class="campo">
                        <label>Código</label>
                        <input type="number" name="codigoproduto" required>
                    </div>
                    <div class="campo">
                        <label>Estoque</label>
                        <input type="number" name="estoque" value="1" required>
                    </div>
                </div>

                <div class="campo-full">
                    <label>Imagem do Produto</label>
                    <input type="file" id="cad-imagem" name="imagem" accept="image/*" required>
                    <div class="previa-box">
                        <img id="previa-img" src="" alt="Prévia">
                    </div>
                </div>

                <button type="submit" class="btn-acao-salvar">Salvar Produto</button>
            </form>
        </div>
    </div>

    <div id="modal-carrinho" class="modal"
        style="display:none; position:fixed; z-index:1000; left:0; top:0; width:100%; height:100%; background:rgba(0,0,0,0.5);">
        <div class="modal-conteudo"
            style="background:#fff; width:90%; max-width:500px; margin:5% auto; padding:20px; border-radius:8px;">
            <h2>🛒 Carrinho de Compras</h2>
            <div id="itens-carrinho"></div>
            <hr>
            <div id="total-carrinho" style="font-size: 1.2em; font-weight: bold; margin: 10px 0;"></div>

            <label><strong>Forma de Pagamento:</strong></label>
            <select id="forma-pagamento" style="width:100%; padding:10px; margin-bottom:15px;">
                <option value="Cartão de Crédito">Cartão de Crédito</option>
                <option value="Pix">Pix</option>
                <option value="Boleto">Boleto</option>
            </select>

            <button onclick="finalizarCompra()"
                style="width:100%; padding:15px; background:#28a745; color:white; border:none; cursor:pointer;">Finalizar
                Compra</button>
            <button onclick="fecharModalCarrinho()"
                style="width:100%; padding:10px; margin-top:5px; background:#dc3545; color:white; border:none; cursor:pointer;">Fechar</button>
        </div>
    </div>
</body>
    <div id="toast-erro">Você só pode comprar um item por vez!</div>
</html>
