<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <title>BIKE PROMAX | Gestão de Clientes</title>
    <link rel="stylesheet" href="index.css"> </head>
    <link rel="stylesheet" href="cliente.css">
<body>
    <header>
        <nav class="container nav-principal">
            <div class="logo"><a href="../index/index.html">BIKE<span>PROMAX</span></a></div>
            <ul class="menu-central" id="menu-navegacao"></ul>
            <ul class="menu-direita">
                <li><a href="javascript:void(0)" onclick="abrirModal()">🛒 Carrinho <span id="contagem-carrinho">(0)</span></a></li>
                <li><a href="javascript:void(0)" onclick="abrirModalLogin()">Login</a></li>
            </ul>
        </nav>
    </header>

    <main class="container" style="margin-top: 50px;">
        <h1>Gestão de Clientes</h1>
        <table class="tabela-clientes">
            <thead>
                <tr><th>ID</th><th>Nome</th><th>Email</th><th>CPF</th></tr>
            </thead>
            <tbody id="listagem-clientes"></tbody>
        </table>
    </main>

    <script src="../index/index.js"></script>
    <script>
        // Lógica específica para carregar clientes
        async function buscarClientes() {
            const res = await fetch("http://127.0.0.1:3000/clientes", {
                headers: { 'minha-chave': "SUA_CHAVE_SECRETA_MUITO_FORTE_123456" }
            });
            const clientes = await res.json();
            const tbody = document.getElementById('listagem-clientes');
            tbody.innerHTML = clientes.map(c => `
                <tr>
                    <td>${c.id}</td>
                    <td>${c.nome}</td>
                    <td>${c.email}</td>
                    <td>${c.cpf || '---'}</td>
                </tr>
            `).join('');
        }

        document.addEventListener('DOMContentLoaded', () => {
            buscarClientes();
            // A função atualizarMenu() já vem do index.js
        });
    </script>
</body>
</html>
