<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <title>Meus Pedidos - BIKEPROMAX</title>
  <link rel="stylesheet" href="vendas.css">
  <script src="vendas.js" defer></script>
</head>

<body>

<!-- Header BIKEPROMAX -->
<!-- Header BIKEPROMAX -->
<header class="navbar">
  <div class="logo">BIKE<span style="color: #ff5e00;">PROMAX</span></div>
  
  <nav class="nav-links">
    <a href="../index/index.html">Início</a>
    <a href="../produto/produto.html">Catálogo</a>
    <a href="#" class="active">Meus Pedidos</a>
  </nav>

  <div class="nav-extras">
    <a href="../carrinho/carrinho.html" class="cart-link">
      🛒 <span class="cart-count">1</span>
    </a>
    <a href="#" class="sair-link">
      ➜ Sair (cliente)
    </a>
  </div>
</header>

<main class="container">
  <section class="pedidos-header">
    <h2>Meus Pedidos</h2>
    <p>Acompanhe o histórico e o status das suas compras.</p>
  </section>

  <section class="tabela-container">
    <table class="tabela-pedidos">
      <thead>
        <tr>
          <th>Nº Pedido</th>
          <th>Cód. Produto</th>
          <th>Data</th>
          <th>Qtd.</th>
          <th>Pagamento</th>
          <th>Valor Total</th>
          <th>Status</th>
        </tr>
      </thead>
      <tbody id="lista-pedidos">
        <!-- As linhas da tabela serão geradas pelo JavaScript -->
      </tbody>
    </table>
    
    <div id="loading" class="mensagem">Buscando seus pedidos no servidor...</div>
    <div id="vazio" class="mensagem hide">Você ainda não possui pedidos na BIKEPROMAX.</div>
  </section>
</main>

</body>
</html>
