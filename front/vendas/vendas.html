<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <title>Gestão de Vendas - BIKEPROMAX</title>
  <link rel="stylesheet" href="vendas.css">
  <script src="vendas.js" defer></script>
</head>

<body>

<header class="navbar">
  <div class="logo">BIKE<span style="color: #ff5e00;">PROMAX</span></div>
  
  <nav class="nav-links">
    <a href="../index/index.html">Início</a>
    <a href="../produto/produto.html">Catálogo</a>
    <a href="#" class="active" id="menu-pedidos">Meus Pedidos</a>
  </nav>

  <div class="nav-extras">
    <a href="../carrinho/carrinho.html" class="cart-link">
      🛒 <span class="cart-count">!</span>
    </a>
    <a href="#" class="sair-link">➜ Sair</a>
  </div>
</header>

<main class="container">
  <section class="pedidos-header">
    <h2 id="titulo-pagina">Histórico de Vendas</h2>
    <p id="subtitulo-pagina">Visualize todas as vendas realizadas no sistema.</p>
  </section>

  <section class="filtro-container" style="margin-bottom: 20px;">
    <input type="text" id="input-pesquisa" placeholder="Pesquisar por produto, código ou pedido..." 
           style="width: 100%; padding: 12px; border-radius: 8px; border: 1px solid #ddd; font-size: 1rem;">
  </section>

  <section class="tabela-container">
    <table class="tabela-pedidos">
      <thead>
        <tr>
          <th>Nº Pedido</th>
          <th>ID Cliente</th> <!-- 🌟 NOVA COLUNA ADICIONADA AQUI -->
          <th>Produto</th> 
          <th>Data</th>
          <th>Qtd.</th>
          <th>Pagamento</th>
          <th>Valor Total</th>
          <th>Status</th>
        </tr>
      </thead>
      <tbody id="lista-pedidos">
        </tbody>
    </table>
    
    <div id="loading" class="mensagem">Buscando dados no servidor...</div>
    <div id="vazio" class="mensagem hide">Nenhuma venda encontrada.</div>
  </section>

</main>

</body>
</html>
