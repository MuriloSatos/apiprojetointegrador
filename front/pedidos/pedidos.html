<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Finalizar Pedido - Bike Pro Max</title>
    
    <!-- Ícones do FontAwesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    
    <!-- Folhas de Estilo (CSS Separado) -->
    <link rel="stylesheet" href="pedidos.css">
</head>
<body>

    <!-- CABEÇALHO PADRÃO -->
    <header>
        <div class="logo">
            <h1>BIKE<span>PROMAX</span></h1>
        </div>
        <nav>
            <ul id="menu-navegacao">
                <!-- Preenchido automaticamente via JavaScript -->
            </ul>
        </nav>
        <div class="header-actions">
            <ul id="menu-direita">
                <!-- Preenchido automaticamente via JavaScript -->
            </ul>
        </div>
    </header>

    <!-- ÁREA PRINCIPAL DO CHECKOUT -->
    <main class="container-checkout">
        <div class="header-checkout">
            <h2>📦 Finalizar <span>Pedido</span></h2>
            <p>Revise seus itens, escolha a forma de pagamento e finalize a compra com segurança.</p>
        </div>

        <div id="conteudo-pedidos">
            <!-- Spinner de carregamento inicial -->
            <div class="carregando">
                <i class="fas fa-spinner fa-spin"></i>
                <p>Carregando seu carrinho...</p>
            </div>
        </div>
    </main>

    <!-- CONTAINER DE TOAST (Alertas visuais de Sucesso/Erro) -->
    <div id="toast-container" class="toast-container"></div>

    <!-- Script de Lógica -->
    <script src="pedidos.js"></script>
</body>
</html>
